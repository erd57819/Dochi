# ?????? ?? ??
spring.application.name=SSAFY-DOCHI-BE
server.port=8080

# ?????? ?? (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/dochi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis ??
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT ??
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# Swagger/OpenAPI ??
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# ?? ??
logging.level.com.ssafy.dochi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# MyBatis ??
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.ssafy.dochi.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ?? ??? ??
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ???? ??
spring.profiles.active=dev

# ??
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#kakao
kakao.rest.api.key=${KAKAO_REST_API_KEY}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.local.api.url=https://dapi.kakao.com/v2/local/search/keyword.json
kakao.redirect-withdraw-uri=${KAKAO_REDIRECT_WITHDRAW_URI}

#S3
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=us-east-1
aws.credentials.access-key=${AWS_ACCESS_KEY}
aws.credentials.secret-key=${AWS_SECRET_KEY}

#????? ???? ??
social.default.password=${SOCIAL_PW}


spring.config.import=optional:env[.env]
