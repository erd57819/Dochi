spring.application.name=SSAFY-DOCHI-BE

# ?? ??
server.port=8080

# ?????? ??
spring.datasource.url=jdbc:mysql://localhost:3306/dochi?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# MyBatis ??
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ssafy.dochi.notice.domain
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.default-executor-type=reuse

# Swagger ??
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ?? ??
logging.level.com.ssafy.dochi=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.springframework.web=DEBUG

# DevTools ??
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
