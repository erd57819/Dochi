version: '3.8'

services:
  # == MYSQL ==
  mysql:
    image: mysql:8.0
    container_name: dochi-mysql
    ports:
      - "3308:3306"  # 외부 3308 → 내부 3306
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=dochi
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dochi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # == REDIS ==
  redis:
    image: redis:7-alpine
    container_name: dochi-redis
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    networks:
      - dochi-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # == REDIS COMMANDER ==
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8083:8081"
    depends_on:
      - redis
    networks:
      - dochi-network


  # == OPENVIDU SERVER ==
  openvidu-server:
    image: openvidu/openvidu-server-kms
    container_name: dochi-openvidu
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-4443}:4443"
      - "${HTTP_PORT:-5443}:5443"
    environment:
      - DOMAIN_OR_PUBLIC_IP=${DOMAIN_OR_PUBLIC_IP:-localhost}
      - CERTIFICATE_TYPE=${CERTIFICATE_TYPE:-selfsigned}
      - OPENVIDU_SECRET=${OPENVIDU_SECRET:-MY_SECRET}
      - OPENVIDU_RECORDING=false
      - OPENVIDU_RECORDING_PUBLIC_ACCESS=false
      - OPENVIDU_WEBHOOK=false
      - OPENVIDU_STREAMS_VIDEO_MAX_RECV_BANDWIDTH=1000
      - OPENVIDU_STREAMS_VIDEO_MIN_RECV_BANDWIDTH=300
      - OPENVIDU_STREAMS_VIDEO_MAX_SEND_BANDWIDTH=1000
      - OPENVIDU_STREAMS_VIDEO_MIN_SEND_BANDWIDTH=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openvidu-recordings:/opt/openvidu/recordings
    networks:
      - dochi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:4443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # Spring Boot 백엔드

  # == BACKEND (Spring Boot) ==
  backend:
    build:
      context: ./SSAFY-DOCHI-BE
      dockerfile: Dockerfile
    container_name: dochi-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/dochi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_REDIS_HOST=dochi-redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - SOCIAL_PW=${SOCIAL_PW}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_REDIRECT_WITHDRAW_URI=${KAKAO_REDIRECT_WITHDRAW_URI}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AI_SERVICE_URL=http://ai-service:8002
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OPENVIDU_URL=http://openvidu-server:4443
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
    networks:
      - dochi-network
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # == AI SERVICE (FastAPI) ==
  ai-service:
    build:
      context: ./SSAFY-DOCJI-AI
      dockerfile: Dockerfile
    container_name: dochi-ai-service
    ports:
      - "8002:8002"
    environment:
      - GMS_KEY=${GMS_KEY}
    networks:
      - dochi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # == FRONTEND (React) ==
  frontend:
    build:
      context: ./SSAFY-DOCHI-FE
      dockerfile: Dockerfile
    container_name: dochi-frontend
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    networks:
      - dochi-network
    restart: unless-stopped
    depends_on:
      - backend

  # == NGINX ==
  nginx:
    image: nginx:alpine
    container_name: dochi-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - dochi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# == VOLUMES ==
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  openvidu-recordings:
    driver: local

# == NETWORKS ==
networks:
  dochi-network:
    driver: bridge
