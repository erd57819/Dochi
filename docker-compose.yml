version: '3.8'

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: dochi-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - dochi-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Spring Boot 백엔드
  backend:
    build:
      context: ./SSAFY-DOCHI-BE
      dockerfile: Dockerfile
    container_name: dochi-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Windows/Mac에서 로컬 MySQL 접속
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/dochi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-your_local_mysql_password}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_min_32_characters}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dochi-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React 프론트엔드
  frontend:
    build:
      context: ./SSAFY-DOCHI-FE
      dockerfile: Dockerfile
    container_name: dochi-frontend
    expose:
      - "80"  # 내부 네트워크에서만 접근 가능
    environment:
      - NODE_ENV=production
    networks:
      - dochi-network
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: dochi-nginx
    ports:
      - "8090:80"  # 외부에서는 8090 포트로 접근
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - dochi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  dochi-network:
    driver: bridge