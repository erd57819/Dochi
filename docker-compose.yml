
services:
  # == MYSQL ==
  mysql:
    image: mysql:8.0
    container_name: dochi-mysql
    ports:
      - "3308:3306"  # 외부 3308 → 내부 3306
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=dochi
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./SSAFY-DOCHI-BE/src/main/resources/static/script.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dochi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # == REDIS ==
  redis:
    image: redis:7-alpine
    container_name: dochi-redis
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    networks:
      - dochi-network
    restart: unless-stopped
    command: redis-server --appendonly yes --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # == REDIS COMMANDER ==
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8083:8081"
    depends_on:
      - redis
    networks:
      - dochi-network


  # == LIVEKIT SERVER (OpenVidu v3) ==
  openvidu-server:
    image: livekit/livekit-server:latest
    container_name: dochi-openvidu
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "APIAhgcveqdsqqe:BoEePALrgYGMqHAvt1n8WQpQ492SR8tPR09eceeR7UeE"
      LIVEKIT_CONFIG: |
        rtc:
          udp_port: 50000
          tcp_port: 7881
          use_external_ip: true
    command:
      - --bind=0.0.0.0
      - --port=7880
    networks:
      - dochi-network



  # Spring Boot 백엔드

  # == BACKEND (Spring Boot) ==
  backend:
    build:
      context: ./SSAFY-DOCHI-BE
      dockerfile: Dockerfile
    container_name: dochi-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/dochi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_REDIS_HOST=dochi-redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - SOCIAL_PW=${SOCIAL_PW}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_REDIRECT_WITHDRAW_URI=${KAKAO_REDIRECT_WITHDRAW_URI}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AI_SERVICE_URL=http://ai-service:8002
      - LIVEKIT_API_KEY=APIAhgcveqdsqqe
      - LIVEKIT_API_SECRET=BoEePALrgYGMqHAvt1n8WQpQ492SR8tPR09eceeR7UeE
      - GMS_KEY=${GMS_KEY}
    networks:
      - dochi-network
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - ai-service
      - openvidu-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # == AI SERVICE (FastAPI) ==
  ai-service:
    build:
      context: ./SSAFY-DOCJI-AI
      dockerfile: Dockerfile
    container_name: dochi-ai-service
    ports:
      - "8002:8002"
    environment:
      - GMS_KEY=${GMS_KEY}
    networks:
      - dochi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # == FRONTEND (React) ==
  frontend:
    build:
      context: ./SSAFY-DOCHI-FE
      dockerfile: Dockerfile
    container_name: dochi-frontend
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    networks:
      - dochi-network
    restart: unless-stopped
    depends_on:
      - backend

  # == NGINX ==
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: dochi-nginx
    ports:
      - "8090:443" # https (배포환경용)
      # - "80:80"    # http (리디렉션용) - 포트 충돌로 비활성화
    volumes:
      # Let's Encrypt 인증서 마운트 (배포환경용)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - dochi-network
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# == VOLUMES ==
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  openvidu-recordings:
    driver: local

# == NETWORKS ==
networks:
  dochi-network:
    name: dochi-network
    driver: bridge
