events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # WebSocket upgrade를 위한 맵 설정
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 로그 형식
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 기본 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream 정의 (Docker Compose 서비스명 사용)
    upstream backend_servers {
        server dochi-backend:8080 max_fails=3 fail_timeout=30s;
    }

    upstream frontend_servers {
        server dochi-frontend:80 max_fails=3 fail_timeout=30s;
    }

    upstream ai_servers {
        server dochi-ai-service:8002 max_fails=3 fail_timeout=30s;
    }
    
    upstream openvidu_servers {
        server dochi-openvidu:7880 max_fails=3 fail_timeout=30s;
    }

    upstream livekit_servers {
        server dochi-openvidu:7880 max_fails=3 fail_timeout=30s;
    }

    # HTTP 서버 (로컬 개발용)
    server {
        listen 80;
        server_name localhost i13c209.p.ssafy.io;
        # HTTP → HTTPS 리디렉션
        return 301 https://$host$request_uri;
    }

    # HTTPS 설정
    server {
        listen 443 ssl;
        server_name localhost i13c209.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/i13c209.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i13c209.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /livekit/ {
            rewrite ^/livekit/(.*)$ /$1 break;

            proxy_pass http://livekit_servers;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            access_log /var/log/nginx/livekit_access.log;
            error_log /var/log/nginx/livekit_error.log debug;
        }

        # AI 서비스 API - /ai로 시작하는 모든 경로
        location /ai/ {
            # OPTIONS 요청 먼저 처리 (CORS preflight)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://ai_servers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # CORS 헤더
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }

        # 백엔드 API - /dochi로 시작하는 모든 경로
        location /dochi/ {
            # OPTIONS 요청 먼저 처리 (CORS preflight)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # CORS 헤더
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        }

        # LiveKit WebSocket 연결 - /openvidu 경로를 /rtc로 라우팅
        location /openvidu {
            # /openvidu -> /rtc로 리다이렉트 (LiveKit WebSocket 엔드포인트)
            rewrite ^/openvidu$ /rtc break;
            
            # WebSocket 연결을 위한 프록시 설정
            proxy_pass http://openvidu_servers;
            proxy_http_version 1.1;
            
            # WebSocket 헤더 설정
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket을 위한 긴 타임아웃
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            # 버퍼링 비활성화 (WebSocket에 중요)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            
            # WebSocket 연결 실패 시 로깅
            access_log /var/log/nginx/openvidu_access.log;
            error_log /var/log/nginx/openvidu_error.log debug;
        }
        
        location /openvidu/ {
            # /openvidu/ -> /rtc/로 리다이렉트 (LiveKit WebSocket 엔드포인트)
            rewrite ^/openvidu/(.*)$ /rtc/$1 break;
            
            # WebSocket 연결을 위한 프록시 설정
            proxy_pass http://openvidu_servers;
            proxy_http_version 1.1;
            
            # WebSocket 헤더 설정
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket을 위한 긴 타임아웃
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            # 버퍼링 비활성화 (WebSocket에 중요)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            
            # WebSocket 연결 실패 시 로깅
            access_log /var/log/nginx/openvidu_access.log;
            error_log /var/log/nginx/openvidu_error.log debug;
        }

        # 건강 상태 체크 엔드포인트
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 정적 파일 캐싱
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 프론트엔드 (React) - 모든 경로 (가장 마지막에 배치)
        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # SPA를 위한 에러 페이지 처리
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        # SPA fallback (React Router 지원)
        location @fallback {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}